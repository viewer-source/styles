<!DOCTYPE html>
<html>
  <head>
    <title>{{ site.name }} – {{ site.description }}</title>
    {% include meta.html %}
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300&display=swap" />
    <link rel="stylesheet" href="/styles/style.css?v={{ site.time | date: '%s' }}" />
    <!-- the chosen style: set by the picker (style-picker.html) -->
    <link rel="stylesheet" id="style-file" disabled />
  </head>
  <body>
    <!-- the site header as on a published site (presentation mode, user 2026-11-08): the website's name (Viewer, no subtitle: user 2026-11-09) -->
    <style>
      /* the header as the smaller top bar of the next Metabolism Regulation version (name 21 px, subtitle 13 px, 12 px
         under it), its left edge on the map list's */
      .wrapper-masthead { margin-bottom: 0; }
      .wrapper-masthead .container { max-width: none; width: min(100vw / var(--zoom, 1) - 32px, 2000px); padding: 0; }
      .masthead { padding: 10px 0 0; }
      /* the name as Reactome writes its own, in every style (user, 2026-11-09): small letters in Comfortaa (the nearest
         free font to Reactome's wordmark), as tall as capitals were */
      .site-name { font-family: Comfortaa, Arial, sans-serif; font-weight: 300; font-size: 28px; line-height: 28px; letter-spacing: 0; text-transform: lowercase; }
      .site-name a, .site-name a:hover { color: #666; }   /* lighter on white (user: Comfortaa has no weight under 300) */
      /* lighter than 300, Comfortaa's lightest (user, 2026-11-09: "250?"): a hair of stroke in the header's background
         colour takes about half the step from 300 to 400 off each letter (measured: ink 1427 at 300, 1732 at 400, 1288
         at 300 with this stroke); styles on another background set the stroke's colour to theirs. Thinner (user,
         2026-11-12): 0.25 px, about 200 (ink at 28 px: 217 at 300, 265 at 400, 187 with 0.12 px, 167 with 0.25 px);
         0.35 px began to break the letters */
      .site-name a { -webkit-text-stroke: 0.25px #fff; }
      .site-description { font-size: 13px; }
      @media (max-width: 940px) { .wrapper-masthead .container { width: auto; padding: 0 16px; } }
    </style>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <div class="site-info">
            <h1 class="site-name"><a href="/styles/">{{ site.header }}</a></h1>
          </div>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>
  </body>
</html>
