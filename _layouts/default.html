<!DOCTYPE html>
<html>
  <head>
    <title>{{ site.name }} – {{ site.description }}</title>
    {% include meta.html %}
    <link rel="stylesheet" href="/styles/style.css?v={{ site.time | date: '%s' }}" />
    <!-- the chosen style: set by the picker (style-picker.html) -->
    <link rel="stylesheet" id="style-file" disabled />
  </head>
  <body>
    <!-- the site header as on a published site (presentation mode, user 2026-11-08): the website's name (Viewer Source, no subtitle: user 2026-11-09) -->
    <style>
      /* the header as the smaller top bar of the next Metabolism Regulation version (name 21 px, subtitle 13 px, 12 px
         under it), its left edge on the map list's */
      .wrapper-masthead { margin-bottom: 0; }
      .wrapper-masthead .container { max-width: none; width: min(100vw / var(--zoom, 1) - 32px, 2000px); padding: 0; }
      .masthead { padding: 10px 0 0; }
      .site-name { font-size: 21px; }
      .site-description { font-size: 13px; }
      @media (max-width: 940px) { .wrapper-masthead .container { width: auto; padding: 0 16px; } }
    </style>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <div class="site-info">
            <h1 class="site-name"><a href="/styles/">{{ site.header }}</a></h1>
          </div>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>
  </body>
</html>
